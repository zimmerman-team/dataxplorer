name: Deploy

# Pulls the image tags in versions.<env>.env and starts them on that environment's
# server. Nothing is built on the server.
#
# Runs when called by deploy-on-merge, update-tag or switch-branch, or by hand
# from the Actions tab. To roll back, restore the previous tag in the versions file.
#
# Each environment deploys on the self-hosted runner labelled with the RUNNER
# value in its versions file (test shares staging's server, so RUNNER=staging).
# The server needs a deploy user in the docker group, logged in to ghcr.io once
# with a read:packages token (docs/MIGRATION.md), and the env file in /opt/dx
# (or the DX_ENV_DIR variable).

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        description: Commit of this repo to deploy
        required: false
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy: the <env> of a versions.<env>.env file"
        required: true
        type: string

jobs:
  runner:
    name: Find ${{ inputs.environment }}'s runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Only deploy production from main
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys only from main, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: label
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          file="versions.$TARGET_ENV.env"
          if [ ! -f "$file" ]; then
            echo "::error::There is no $file."
            exit 1
          fi
          label="$(sed -n 's/^RUNNER=//p' "$file")"
          if [ -z "$label" ]; then
            echo "::error::$file has no RUNNER line naming the server's runner label."
            exit 1
          fi
          echo "$TARGET_ENV deploys on the runner labelled $label"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: runner
    runs-on: [self-hosted, "${{ needs.runner.outputs.label }}"]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.environment }}
      ENV_DIR: ${{ vars.DX_ENV_DIR || '/opt/dx' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Pulls use the server's own `docker login ghcr.io` (a read:packages
      # token), so there's no login step here: one would also log the server
      # out again when the job ends.
      - name: Deploy
        run: make up ENV="$TARGET_ENV" ENV_DIR="$ENV_DIR"

      - name: Show the running services
        if: always()
        run: make ps ENV="$TARGET_ENV" ENV_DIR="$ENV_DIR"

      - name: Remove images unused for a week
        run: docker image prune --all --force --filter "until=168h"
